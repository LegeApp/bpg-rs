[workspace]
resolver = "2"
members = [
    "crates/bpg-bitstream",
    "crates/bpg-image",
    "crates/bpg-format",
    "crates/bpg-hevc",
    "crates/bpg-hevc-decode",
    "crates/bpg-decode",
    "crates/bpg-encode",
    "crates/bpg-x265-sys",
    "crates/bpg-x265",
    "crates/x265-primitives-sys",
    "crates/x265-primitives",
    "crates/bpg-still-hevc",
    "crates/bpg-oracle",
    "crates/bpg-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
debug = "line-tables-only"
lto = false
strip = false

[profile.profiling]
inherits = "release"
debug = true
lto = false
strip = false
codegen-units = 16

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
strip = false
