[package]
name = "bpg-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bpg-tools"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
bpg-image = { path = "../bpg-image" }
bpg-format = { path = "../bpg-format" }
bpg-hevc = { path = "../bpg-hevc" }
bpg-decode = { path = "../bpg-decode" }
bpg-encode = { path = "../bpg-encode" }
bpg-x265 = { path = "../bpg-x265", optional = true }
bpg-still-hevc = { path = "../bpg-still-hevc" }

[features]
default = []
oracle-x265 = ["dep:bpg-x265"]
# Marker feature for profiling runs, intended for:
# cargo flamegraph --profile profiling -p bpg-tools --features flamegraph -- ...
flamegraph = ["bpg-still-hevc/flamegraph"]
