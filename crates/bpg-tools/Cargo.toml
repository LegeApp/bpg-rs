[package]
name = "bpg-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bpg-tools"
path = "src/main.rs"

[[bin]]
name = "bpg-highres-compare"
path = "src/bin/highres_compare.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
png = "0.17"
zune-png = "0.4"
zune-jpeg = "0.4"
zune-core = "0.4"
bpg-image = { path = "../bpg-image" }
bpg-format = { path = "../bpg-format" }
bpg-hevc = { path = "../bpg-hevc" }
bpg-decode = { path = "../bpg-decode" }
bpg-encode = { path = "../bpg-encode" }
still265 = { path = "../still265" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[features]
# Normal `bpg-tools` builds include the bit-identical portable-SIMD hot kernels.
default = ["wide-simd"]
# Marker feature for profiling runs, intended for:
# cargo flamegraph --profile profiling -p bpg-tools --features flamegraph -- ...
flamegraph = ["still265/flamegraph"]
# Build the `still265` encoder with its portable-SIMD (`wide`) hot kernels.
# Selectable at runtime via `BPG_PRIMITIVES`; bit-identical output either way.
wide-simd = ["still265/wide-simd"]
