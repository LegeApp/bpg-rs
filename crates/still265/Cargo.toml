[package]
name = "still265"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust-native still-picture HEVC intra encoder (still265): a line-by-line port of x265's still-image encode path."

[dependencies]
bpg-bitstream = { path = "../bpg-bitstream" }
bpg-encode = { path = "../bpg-encode" }
bpg-image = { path = "../bpg-image" }
# Reused for the encoder's reconstruction engine: the decoder's `predict_intra`
# + `DecodedFrame` are the exact spec operations the encoder must invert, so
# reusing them guarantees the decoder reproduces the encoder's reconstruction.
# (Phase 5 interim; a self-contained intra_pred.rs port is a later refactor.)
bpg-hevc-decode = { path = "../bpg-hevc-decode" }

[features]
default = []
# Marker feature for profiling builds. Keep profiling-only instrumentation
# behind this feature if it would perturb normal release measurements.
flamegraph = []

[dev-dependencies]
bpg-hevc = { path = "../bpg-hevc" }
