[package]
name = "bpg-hevc-decode"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Pure-Rust HEVC still-picture intra decoder, vendored/adapted from heic-decoder-rs for BPG."

[dependencies]
archmage = { version = "0.8", default-features = false, features = ["macros", "safe_unaligned_simd"] }
safe_unaligned_simd = "0.2"
# Optional portable-SIMD backend (pure Rust) for the chroma-upsampling color
# kernels. Bit-identical to the scalar reference; only swaps in vectorized
# multiply-accumulate. Mirrors the `wide-simd` pattern used by `still265`.
wide = { version = "1.3", optional = true }
# Optional row-level data parallelism for the color-output kernels. For
# YCbCr→RGB (a cross-channel per-pixel conversion) lane-wise SIMD gives little;
# distributing whole output rows across cores is the effective speedup. Output
# is bit-identical (rows are independent). Off by default to keep the library
# dependency-light for embedding; `bpg-tools` enables it.
rayon = { version = "1.10", optional = true }

[features]
default = ["std"]
std = ["archmage/std"]
# Vectorize the chroma-upsampling kernels with `wide`. Output is bit-identical.
wide-simd = ["dep:wide"]
# Parallelize the color-output kernels across rows with `rayon`. Bit-identical.
rayon = ["dep:rayon"]
