[package]
name = "bpg-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "x265 reference oracle: regenerable BPG encode corpus + metrics, the comparison baseline for the future Rust still-HEVC encoder."

[dependencies]
bpg-image = { path = "../bpg-image" }
bpg-encode = { path = "../bpg-encode" }
bpg-x265 = { path = "../bpg-x265" }
bpg-decode = { path = "../bpg-decode" }
bpg-format = { path = "../bpg-format" }
bpg-hevc = { path = "../bpg-hevc" }
image = "0.25"
clap = { version = "4.6", features = ["derive"] }
