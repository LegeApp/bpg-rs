[package]
name = "bpg-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bpg-tools"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
bpg-image = { path = "../bpg-image" }
bpg-format = { path = "../bpg-format" }
bpg-hevc = { path = "../bpg-hevc" }
bpg-encode = { path = "../bpg-encode" }
bpg-x265 = { path = "../bpg-x265" }
