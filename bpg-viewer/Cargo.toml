[package]
name = "bpg-viewer"
version = "0.2.0"
edition = "2021"
description = "Minimal, fast BPG image viewer"

[[bin]]
name = "bpg-view"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Pure-Rust BPG decoder (bpg-rs workspace) — replaces the C libbpgdec FFI.
bpg-decode = { path = "../bpg-rs/crates/bpg-decode" }
eframe = { version = "0.32", default-features = false, features = ["glow", "wayland", "x11"] }

[profile.release]
opt-level = 3
lto = "thin"
